name: PR build

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build ${{ matrix.name }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: v2rayN.Windows (WPF)
            project: v2rayN/v2rayN.Windows/v2rayN.Windows.csproj
          - name: v2rayN.Desktop (Avalonia)
            project: v2rayN/v2rayN.Desktop/v2rayN.Desktop.csproj
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Build
      shell: bash
      run: dotnet build "${{ matrix.project }}" -c Release -p:EnableWindowsTargeting=true
